[tool.poetry]
name = "c3tools"
version = "0.1.0"
description = ""
authors = ["Naoya Yamashita <conao3@gmail.com>"]

[tool.poetry.scripts]
c3tools = "c3tools.main:app"

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.27.3"
Jinja2 = "^3.1.6"
jmespath = "^1.1.0"
PyYAML = "^6.0.3"
pydantic = "^2.14.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 99

[tool.isort]
profile = 'black'
line_length = 99

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "autoflake (>=2.4.0,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
